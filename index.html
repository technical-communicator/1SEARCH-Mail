<!DOCTYPE html>
<!-- index.html: the home page. GitHub Pages serves this file at the site's root URL. -->
<html lang="en">
<head>
  <!-- Character set and viewport: the viewport line makes the page fit phone screens. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- The title shows in the browser tab and in search results. -->
  <title>Search Central Florida | Orlando arts, culture and local events</title>
  <meta name="description" content="Search Central Florida helps you find cool local events, art and small businesses in Orlando.">

  <!-- Little mascot icon in the browser tab. -->
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts from Google Fonts: Rubik Dirt for big headings, Courier Prime for labels. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Rubik+Dirt&display=swap">

  <!-- One shared stylesheet for every page. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Site header: the same block appears on every page. -->
  <header class="site-header">
    <!-- The logo (mascot head + name) links back to the home page. -->
    <a class="logo" href="index.html">
      <!-- alt="" because the words next to it already name the link. -->
      <img src="images/mascot-head-white.webp" alt="" width="178" height="200">
      <span class="logo-text">
        <span class="logo-name">SEARCH</span>
        <span class="logo-sub">Central Florida</span>
      </span>
    </a>
    <nav>
      <a href="events.html">Events</a>
      <a href="mailclub.html">Mail Club</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <!-- The "hero" is the big intro area at the top of the page. -->
    <!-- On phones the mascot sits on top; on wider screens it moves to the left. -->
    <section class="hero">
      <img class="mascot" src="images/mascot.webp" width="800" height="800"
           alt="The SEARCH mascot: a girl in a purple cat-ear hood with silver ear rings, on a red halftone background">

      <div>
        <h1>Search Central Florida</h1>
        <div class="panel">
          <p>Your guide to the best local art, music, markets and events in Orlando, so you can get off your phone and out the door.</p>
        </div>

        <!-- Big buttons linking to the other pages. -->
        <div class="buttons">
          <a class="button" href="events.html">See events</a>
          <a class="button button-outline" href="mailclub.html">Join the mail club</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <!-- alt="" because the stamp is decoration; the text below says the same thing. -->
    <img src="images/stamp.png" alt="" width="600" height="600">
    <p>Follow us on Instagram: <a href="https://www.instagram.com/searchcentralfl/">@searchcentralfl</a></p>
  </footer>
</body>
</html>
